<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>그려봐!</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div id="conn-banner" class="conn-banner" role="status" hidden></div>
  <!-- 메인 화면: 닉네임 입력, 방 만들기, 방 코드로 참가 (wireframes.md 1장) -->
  <main id="screen-main" class="screen card">
    <h1 class="logo">그려봐!</h1>
    <p class="subtitle">친구와 함께 그리고 맞히는 게임</p>

    <label class="field">
      <span>닉네임</span>
      <input id="nickname" type="text" maxlength="10" placeholder="최대 10자" autocomplete="off">
    </label>

    <button id="btn-create" class="btn primary" disabled>방 만들기</button>

    <div class="divider"><span>또는</span></div>

    <div class="join-row">
      <input id="room-code" type="text" maxlength="6" placeholder="방 코드 6자리" autocomplete="off">
      <button id="btn-join" class="btn" disabled>참가</button>
    </div>

    <p id="main-error" class="error" role="alert" hidden></p>
  </main>

  <!-- 대기실: 방 코드 공유, 참가자 목록, 게임 시작 (wireframes.md 2장) -->
  <main id="screen-lobby" class="screen card" hidden>
    <header class="lobby-head">
      <span class="logo small">그려봐!</span>
      <button id="btn-leave" class="btn ghost">나가기</button>
    </header>

    <section class="share">
      <div>
        <span class="label">방 코드</span>
        <strong id="lobby-code" class="code"></strong>
      </div>
      <div class="share-buttons">
        <button id="btn-copy-code" class="btn small">코드 복사</button>
        <button id="btn-copy-link" class="btn small">링크 복사</button>
      </div>
    </section>
    <p id="copy-note" class="note" aria-live="polite"></p>

    <section>
      <h2 class="label">참가자 <span id="player-count"></span></h2>
      <ul id="player-list" class="players"></ul>
    </section>

    <p class="note">게임 설정: 3라운드, 80초</p>

    <button id="btn-start" class="btn primary" hidden disabled>게임 시작</button>
    <p id="lobby-status" class="note center"></p>
  </main>

  <!-- 게임 화면: 타이머·힌트, 점수판, 캔버스, 채팅, 그리기 도구 (wireframes.md 3장) -->
  <main id="screen-game" class="screen game" hidden>
    <header class="game-top">
      <span id="round-label" class="round"></span>
      <span id="hint" class="hint" aria-live="polite"></span>
      <span class="top-right">
        <span id="timer" class="timer" aria-label="남은 시간"></span>
        <button id="btn-sound" class="btn small sound-toggle" type="button" aria-pressed="true">소리 켜짐</button>
      </span>
    </header>

    <aside class="scoreboard" aria-label="점수판">
      <ol id="scoreboard"></ol>
    </aside>

    <section class="stage">
      <div class="board-wrap">
        <canvas id="board" class="board" aria-label="그림판"></canvas>
        <div id="overlay" class="overlay" hidden></div>
      </div>
      <div id="tools"></div>
    </section>

    <section class="chat" aria-label="채팅">
      <ul id="chat-log" class="chat-log" aria-live="polite"></ul>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" type="text" maxlength="50" placeholder="정답을 입력하세요">
        <button class="btn small" type="submit">전송</button>
      </form>
    </section>
  </main>

  <!-- 결과 화면: 시상대, 전체 순위 (wireframes.md 4장) -->
  <main id="screen-result" class="screen card result" hidden>
    <h1 class="logo small center">최종 순위</h1>
    <div id="podium" class="podium"></div>
    <ol id="rank-rest" class="rank-rest"></ol>
    <div class="result-buttons">
      <button id="btn-again" class="btn primary">다시 하기</button>
      <button id="btn-exit" class="btn">나가기</button>
    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <script src="{{ url_for('static', filename='canvas.js') }}"></script>
  <script src="{{ url_for('static', filename='main.js') }}"></script>
  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
